<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>持仓复盘 Demo</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="mark">复</div>
        <div>
          <h1>持仓复盘 Demo</h1>
          <p>公开演示版 · 虚构试验数据 · Schema 1.3</p>
        </div>
      </div>
      <div class="toolbar">
        <select id="dateSelect" aria-label="选择交易日"></select>
        <button type="button" class="btn" id="btnReset">重置备注</button>
        <button type="button" class="btn primary" id="btnRestore">恢复演示数据</button>
      </div>
    </div>
  </header>

  <div class="banner">
    <div class="wrap">
      <p>页面里的标的、价格、成交和账户数字都是 2026-09-01 至 2026-09-28 的虚构试验数据（4 个模拟标的、23 笔模拟成交）。内容只写在这台浏览器的 localStorage 里，没有服务器。</p>
    </div>
  </div>

  <div class="wrap">
    <nav class="tabs" aria-label="视图">
      <button type="button" class="tab" id="tab-overview" data-tab="overview" aria-selected="true">总览</button>
      <button type="button" class="tab" id="tab-holdings" data-tab="holdings" aria-selected="false">持仓</button>
      <button type="button" class="tab" id="tab-trades" data-tab="trades" aria-selected="false">交易</button>
      <button type="button" class="tab" id="tab-review" data-tab="review" aria-selected="false">复盘</button>
    </nav>
    <main>
      <section id="panel-overview" class="panel active" aria-label="总览"></section>
      <section id="panel-holdings" class="panel" aria-label="持仓"></section>
      <section id="panel-trades" class="panel" aria-label="交易"></section>
      <section id="panel-review" class="panel" aria-label="复盘"></section>
    </main>
    <p class="footer">演示数据，不是投资建议。恢复演示数据会用仓库内置种子覆盖本机账本和备注。</p>
  </div>

  <script src="js/data/seed.js"></script>
  <script src="js/logic/schema.js"></script>
  <script src="js/logic/format.js"></script>
  <script src="js/logic/portfolio.js"></script>
  <script src="js/logic/trades.js"></script>
  <script src="js/logic/state.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
